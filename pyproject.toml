[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frac-blp"
version = "0.6.0"
description = "FRAC estimation for macro-BLP models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "bs_python_utils>=0.8.2",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pandas>=2.3.3",
    "rich>=15.0.0",
]

[project.scripts]
frac_nodemog = "frac_blp.frac_nodemog:main"

[tool.setuptools]
packages = ["frac_blp", "frac_blp.examples"]

[tool.setuptools.package-data]
"frac_blp" = ["examples/*.py", "configs/*.toml", "configs/data/*.csv"]
